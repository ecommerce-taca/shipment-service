spring:
  application:
    name: shipment-service
  profiles:
    default: local
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:15406/shipmentdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:shipment}
    password: ${DB_PASSWORD:shipment_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: ${SPRING_KAFKA_PRODUCER_RETRIES:3}
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: ${SPRING_KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:10000}
        request.timeout.ms: ${SPRING_KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:5000}
    consumer:
      group-id: shipment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    db:
      enabled: true
shipment:
  env: ${APP_ENV:local}
  version: ${APP_VERSION:0.2.0-SNAPSHOT}
  security:
    internal-token: ${SHIPMENT_INTERNAL_TOKEN:local-dev-token-change-me}
    ops-token: ${SHIPMENT_OPS_TOKEN:}
    enforce-gateway-headers: ${SHIPMENT_ENFORCE_GATEWAY_HEADERS:true}
  carrier:
    request-timeout-ms: 5000
    quote-ttl-minutes: 30
    mock-enabled: ${SHIPMENT_MOCK_ENABLED:true}
    ghn:
      enabled: ${GHN_ENABLED:false}
      base-url: ${GHN_BASE_URL:}
      token: ${GHN_TOKEN:}
      shop-id: ${GHN_SHOP_ID:}
  kafka:
    shipment-events-topic: ${SHIPMENT_EVENTS_TOPIC:shipment.events.v1}
    dlq-topic: ${SHIPMENT_DLQ_TOPIC:shipment.events.dlq.v1}
    send-timeout-ms: ${SHIPMENT_KAFKA_SEND_TIMEOUT_MS:15000}
    publisher-enabled: ${SHIPMENT_KAFKA_PUBLISHER_ENABLED:false}
    consumer-enabled: ${SHIPMENT_KAFKA_CONSUMER_ENABLED:false}
    order-events-topic: ${ORDER_EVENTS_TOPIC:order.events.v1}
    create-consumer-enabled: ${SHIPMENT_CREATE_CONSUMER_ENABLED:false}
    create-commands-topic: ${SHIPMENT_CREATE_COMMANDS_TOPIC:shipment.commands.v1}
    create-consumer-group-id: ${SHIPMENT_CREATE_CONSUMER_GROUP_ID:shipment-service-create-v1}
    consumer-dlq-topic: ${SHIPMENT_CONSUMER_DLQ_TOPIC:shipment.consumer.dlq.v1}
    consumer-retry-count: ${SHIPMENT_CONSUMER_RETRY_COUNT:3}
    command-poll-delay-ms: ${SHIPMENT_COMMAND_POLL_DELAY_MS:250}
    command-lease-seconds: ${SHIPMENT_COMMAND_LEASE_SECONDS:120}
  outbox:
    lease-seconds: ${SHIPMENT_OUTBOX_LEASE_SECONDS:60}
